name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install GraphGuard (editable)
        run: |
          pip install -e .

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

      - name: Run demos (smoke tests)
        run: |
          python demo.py
          python demo_phase3.py
          python demo_phase4.py
          python demo_phase5.py

      - name: Verify CLI
        run: |
          graphguard run --scenario file_backup --monitor graph --steps 5
          graphguard calibrate --monitor graph --fpr 0.01 0.05
          graphguard ablate --scenarios data_exfiltration --fpr 0.05

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Check formatting (black)
        run: |
          black --check harness/ dataset/ monitors/ evaluator/ graphguard/ tests/ demo*.py

      - name: Lint (ruff)
        run: |
          ruff check harness/ dataset/ monitors/ evaluator/ graphguard/ tests/ demo*.py

      - name: Type check (mypy)
        run: |
          mypy harness/ monitors/ evaluator/ graphguard/ || true
