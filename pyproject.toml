[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphguard"
version = "0.1.0"
description = "Early Warning of Unsafe Long-Horizon Agent Behavior from Partial Execution Graphs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GraphGuard Contributors" },
]
license = { text = "MIT" }
keywords = [
    "ai-safety",
    "agent-safety",
    "llm-agents",
    "prompt-injection",
    "graph-neural-networks",
    "early-warning",
    "behavior-graphs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material",
]

[project.scripts]
graphguard = "graphguard.cli:main"

[tool.setuptools.packages.find]
include = ["harness*", "dataset*", "monitors*", "evaluator*", "graphguard*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "Q", "R", "S", "UP"]
